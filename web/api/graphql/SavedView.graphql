query MySavedViews($rootLocationIds: [ID!]) {
  mySavedViews(rootLocationIds: $rootLocationIds) {
    id
    name
    baseEntityType
    filterDefinition
    sortDefinition
    parameters
    relatedFilterDefinition
    relatedSortDefinition
    relatedParameters
    ownerUserId
    visibility
    locationId
    location {
      id
      title
      kind
      parent {
        id
        title
        kind
        parent {
          id
          title
          kind
        }
      }
    }
    createdAt
    updatedAt
    isOwner
  }
}

query SavedView($id: ID!) {
  savedView(id: $id) {
    id
    name
    baseEntityType
    filterDefinition
    sortDefinition
    parameters
    relatedFilterDefinition
    relatedSortDefinition
    relatedParameters
    ownerUserId
    visibility
    locationId
    location {
      id
      title
      kind
      parent {
        id
        title
        kind
        parent {
          id
          title
          kind
        }
      }
    }
    createdAt
    updatedAt
    isOwner
  }
}

mutation CreateSavedView($data: CreateSavedViewInput!) {
  createSavedView(data: $data) {
    id
    name
    baseEntityType
    filterDefinition
    sortDefinition
    parameters
    relatedFilterDefinition
    relatedSortDefinition
    relatedParameters
    ownerUserId
    visibility
    locationId
    location {
